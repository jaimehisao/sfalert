<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SFALERT — San Francisco CAD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app">
    <div id="map" role="application" aria-label="San Francisco CAD map"></div>

    <header class="chrome">
      <div class="brand">
        <span class="pulse" id="pulse" aria-hidden="true"></span>
        <div>
          <div class="wordmark">SFALERT</div>
          <div class="sub" id="statusLine">loading CAD…</div>
        </div>
      </div>

      <div class="pills" id="windows" role="tablist" aria-label="Time window">
        <button type="button" data-window="3h">3h</button>
        <button type="button" data-window="6h">6h</button>
        <button type="button" data-window="12h">12h</button>
        <button type="button" data-window="24h" class="on">24h</button>
        <button type="button" data-window="7d">7d</button>
        <button type="button" data-window="30d">30d</button>
      </div>

      <label class="search">
        <span class="sr-only">Search incidents</span>
        <input id="q" type="search" placeholder="Search calls, streets, CAD…" autocomplete="off" />
      </label>

      <label class="field district">
        <span>District</span>
        <select id="district">
          <option value="">All districts</option>
        </select>
      </label>

      <div class="switches">
        <button type="button" class="switch on" id="heatmap" aria-pressed="true">Heat</button>
        <button type="button" class="switch on" id="pins" aria-pressed="true">Pins</button>
        <button type="button" class="switch" id="openOnly" aria-pressed="false">Open</button>
        <button type="button" class="switch on" id="hideRoutine" aria-pressed="true">Skip noise</button>
      </div>

      <button type="button" id="refresh">Sync</button>
      <button type="button" id="feedToggle" class="mobile-only">Feed</button>
    </header>

    <nav class="cats" id="cats" aria-label="Call categories"></nav>

    <aside class="drawer" id="panel">
      <section class="stats" id="stats"></section>
      <section class="spark-wrap">
        <h2>Hour of day</h2>
        <div class="spark" id="hours"></div>
      </section>
      <section class="hotspots" id="hotspots"></section>
      <section id="detail" hidden></section>
      <section class="feed-head">
        <h2>Live feed</h2>
        <span id="feedCount"></span>
      </section>
      <div class="feed" id="feed"></div>
    </aside>

    <div class="legend" id="legend"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script src="/app.js"></script>
</body>
</html>
